function priorSpend(t,stage,index){let total=0;for(let r=2;r<stage;r++)total+=t.submissions?.[r]?.plan?.[index]||0;return total}
function capabilitySupport(t,stage,a){const design=funded(t,stage,'core')+funded(t,stage,'inclusive'),experience=funded(t,stage,'reliable')+funded(t,stage,'care');if(a.id==='meaning')return .7+.3*Math.min(1,design/15);if(a.id==='adjacent')return .4+.6*Math.min(1,(design+experience)/30);if(a.id==='expansion')return .45+.55*Math.min(1,(design+experience)/35);return 1}

function teacherHTML(){const g=game(),teams=Object.entries(dbState.teams),submitted=teams.filter(([,t])=>validSubmission(g.stage,t.submissions?.[g.stage])).length;return stageBar()+'<div class="section-head"><div><div class="eyebrow">Instructor dashboard</div><h1>'+STAGES[g.stage].name+'</h1></div><span class="chip">'+submitted+' / '+teams.length+' submitted</span></div><div class="controls">'+button(g.phase==='report'?'Start next stage':'Start stage','start',false,!(g.phase==='report'||g.phase==='ready'||(g.stage===0&&!g.started&&!g.running)))+button(g.stage===0?'Finish briefing':'Close stage & report','report',true,g.stage>=8||g.phase==='report'||g.phase==='closing')+button(g.running?'Pause':'Resume','pause',true,g.phase==='complete'||g.phase==='ready'||(g.stage===0&&!g.started&&!g.running))+'</div><div class="note"><b>Decision → report → next stage</b><p>Starting opens decisions and starts the clock. Closing publishes results and starts a separate report timer. At zero, decision time opens the report; report time automatically opens the next stage. Pause freezes either phase. Use Start next stage during a report to move on early.</p><small>Keep this instructor page open and connected for automatic transitions.</small></div><div class="controls"><label class="mode-label">Session mode<select id="mode" '+(g.stage!==0||g.running?'disabled':'')+'><option value="class" '+(g.mode==='class'?'selected':'')+'>Class · 75 minutes</option><option value="demo" '+(g.mode==='demo'?'selected':'')+'>Demo · 6 automated rivals</option></select></label>'+button('Reset session','reset',true)+button('Sign out','logout',true)+'</div>'+(g.mode==='demo'?'<p class="muted">Six automated rivals choose when each decision stage opens. Demo: 2 minutes deciding + 1 minute reporting; briefing and final debrief use 3 minutes.</p>':'')+'<div class="note"><div class="eyebrow">Teaching cue</div><p>'+NOTES[g.stage]+'</p></div><div class="panel"><h3>Teams & commitments</h3><div class="table-wrap"><table><tr><th>Brand</th><th>Status</th><th>Portfolio</th></tr>'+teams.map(([uid,t])=>{const sub=t.submissions?.[g.stage];return '<tr><td>'+esc(t.name)+'</td><td>'+(validSubmission(g.stage,sub)?'Saved':sub?'Incomplete':/^bot[0-5]$/.test(uid)&&g.mode==='demo'?'Automatic on start':'Waiting')+'</td><td>'+(sub?.plan?sub.plan.map((v,i)=>v?ACTIONS[g.stage][i].name+': '+v:'').filter(Boolean).join(' · '):sub?(POSITIONS[sub.pos]||'Promise not yet chosen'):'—')+'</td></tr>'}).join('')+'</table></div></div>'+reportHTML(latestReport(),false)+(g.stage===8?finalOverview()+teams.map(([uid,t])=>'<details class="panel"><summary>'+esc(t.name)+' — strategy alternatives</summary>'+alternativesHTML(uid)+'</details>').join(''):'')+'<div class="controls">'+button('Instructor scoring guide','guide',true)+button('Export session results','export',true)+'</div>'}
function getDraft(){return myTeam()?.submissions?.[game().stage]||{plan:Array(8).fill(0)}}
function positioningHTML(){const d=getDraft();return '<div class="panel"><label for="brand-name">Choose from your team’s six exclusive names</label><select id="brand-name"><option value="">Select a name and its associations</option>'+nameIdsFor(teamKey()).map(i=>{const n=NAME_BANK[i];return '<option value="'+i+'" '+(d.nameId===i?'selected':'')+'>'+n.name+' — '+n.meaning+'</option>'}).join('')+'</select><p class="muted">A name that strongly contradicts your promise can make the brand harder to understand. These six names belong only to your team. Every team has the same balance of naming associations and fit penalties.</p></div><div class="cards positions">'+POSITIONS.map((p,i)=>'<button class="option '+(d.pos===i?'chosen':'')+'" data-pos="'+i+'" aria-pressed="'+(d.pos===i)+'"><h3>'+p+'</h3><p>'+['Dependable comfort for busy everyday users.','Credible technical function for committed active users.','Distinctive design for expressive customers.'][i]+'</p><small>D / R / E / K: '+STARTS[i].join(' / ')+' · $210M before naming fit</small></button>').join('')+'</div><p class="muted">Both selections save immediately. You can change them until this stage closes.</p>'}
function investmentsHTML(){const d=getDraft(),plan=d.plan||Array(8).fill(0),spent=sum(plan);if(!validSubmission(1,myTeam()?.submissions?.[1]))return '<div class="note">This team did not finish choosing a name and promise. Ask the instructor to reset if you need to restart.</div>';return '<div class="budget"><div><small>Investment budget</small><strong id="budget-left">'+(25-spent)+' <span>credits remaining</span></strong></div><small>Up to 4 methods · 5-credit steps · maximum 15 per method<br>A partial allocation is saved and scored; unused credits expire.</small></div><div class="investment-areas">'+AREAS.map(area=>'<section class="area-box"><div class="eyebrow">'+area.name+'</div><p class="muted">'+area.desc+'</p><div class="cards">'+CATALOG.map((a,i)=>a.area!==area.id?'':'<article class="investment"><h3>'+a.name+'</h3><p><b>What you do:</b> '+a.desc+'</p><p><b>What customers notice:</b> '+a.effect+'</p><small><b>Tradeoff:</b> '+a.trade+'</small><div class="allocation"><button class="secondary" data-adjust="'+i+':-5" aria-label="Reduce '+a.name+'" '+(!plan[i]?'disabled':'')+'>−</button><output id="amount-'+i+'">'+plan[i]+'</output><span>credits</span><button class="secondary" data-adjust="'+i+':5" aria-label="Invest in '+a.name+'" '+(spent>=25||plan[i]>=15||(!plan[i]&&plan.filter(Boolean).length>=4)?'disabled':'')+'>+</button></div></article>').join('')+'</div></section>').join('')+'</div><div class="panel"><h3>Your complete selection</h3>'+(spent?'<ul>'+plan.map((v,i)=>v?'<li>'+CATALOG[i].name+': '+v+' credits</li>':'').join('')+'</ul>':'<p>No investment selected yet.</p>')+'<small>Every change saves automatically. No lock button is needed. Previous investment remains in your brand; repeating a method has diminishing returns.</small></div>'}
function teamHTML(){if(!myTeam())return joinHTML();const g=game(),t=myTeam(),submitted=t.submissions?.[g.stage],report=latestReport();let html=stageBar()+'<div class="section-head"><div><div class="eyebrow">'+(g.mode==='demo'?'Teacher-led demo':'Your brand')+'</div><h1>'+esc(t.name)+'</h1></div>'+(report?.rows?.find(r=>r.uid===store.uid())?'<strong class="value">'+money(bv(report.rows.find(r=>r.uid===store.uid()).scores))+'</strong>':'<strong class="value">$210M</strong>')+'</div>'+valueFormula(report?.rows?.find(r=>r.uid===store.uid())?.scores|| (validSubmission(1,t.submissions?.[1])?STARTS[t.submissions[1].pos]:null));
if(g.stage===0)html+='<div class="note"><h3>You’re in. Meet your team.</h3><p>Discuss the difference between being famous, useful, respected and distinctive. Your teacher will open naming and positioning when the class is ready.</p></div>';
else if(g.stage===8){html+=reportHTML(report)+finalOverview()+alternativesHTML(store.uid())+recap(t)+button('Download team recap','team-export');}
else if(g.phase==='report'){html+=reportHTML(report)+ '<div class="note"><b>Prepare your next move.</b><p>Review where your equity grew and which tradeoffs mattered. The next decision stage opens automatically when this report timer ends.</p></div>';}
else{html+=coachHTML(t,g.stage)+'<div class="note"><div class="eyebrow">Brand Note · '+STAGES[g.stage].name+'</div><p>'+NOTES[g.stage]+'</p></div>'+(EVENTS[g.stage]?'<div class="event"><b>'+EVENTS[g.stage].title+'</b><p>'+EVENTS[g.stage].text+'</p></div>':'');if(g.stage>1&&report)html+='<details class="intel"><summary>Open prior market report before investing</summary>'+reportHTML(report,false)+'</details>';
html+='<div id="waiting" class="note" '+(openRound()?'hidden':'')+'><h3>Waiting for the instructor</h3><p id="wait-message">The teacher controls when this round opens and closes.</p></div>';
html+='<div class="note"><b id="save-status" role="status">'+esc(saveMessage)+'</b><small> · shared with '+esc(selectedTeam.replace('team','Team '))+'</small></div><fieldset id="decision-fields" '+(!openRound()?'disabled':'')+'>'+(g.stage===1?positioningHTML():investmentsHTML())+'</fieldset>';

}
return html}
function recap(t){return '<div class="panel"><h2>Your strategy history</h2>'+Object.entries(t.submissions||{}).map(([stage,sub])=>'<details><summary>'+STAGES[stage].name+(stage==='1'?' · '+POSITIONS[sub.pos]:'')+'</summary>'+(sub.plan?'<ul>'+sub.plan.map((v,i)=>v?'<li>'+ACTIONS[stage][i].name+': '+v+' credits</li>':'').join('')+'</ul>':'')+'</details>').join('')+'</div>'}
function coachHTML(t,stage){if(stage===1)return '';const r=latestReport()?.rows?.find(x=>x.uid===store.uid());if(!r)return '';const [D,R,E,K]=r.scores,issues=[];const portfolio=r.portfolio||[];
if(portfolio.some(a=>a.support<.85))issues.push('Some commitments ran ahead of the capabilities your brand had already established. The issue was the sequence and credibility of the investment.');
if(portfolio.some(a=>a.fit<.95))issues.push('Parts of the portfolio fitted your chosen promise less closely, weakening the coherence of the overall strategy.');
if(portfolio.some(a=>a.crowd<.95))issues.push('Your investments overlapped with competitors, making their contribution less distinctive in this market.');
if(r.stage>1&&r.spent<25)issues.push('Part of the available budget went unused, limiting the progress made this round.');
if(portfolio.some(a=>a.efficiency<a.fit*a.support*a.crowd*.8))issues.push('Some spending produced a smaller marginal return because of repeated investment, concentration or market timing.');
if(!issues.length&&r.stage>1)issues.push('No major mismatch is evident in the latest portfolio. The remaining tradeoffs concern how broadly your investments contributed to brand equity.');
const profile=E>K+1?'The brand is more respected than it is familiar or understood.':K>E+1?'The brand is better known and understood than it is respected.':'Familiarity and respect are currently fairly balanced.';
return '<div class="note coach"><div class="eyebrow">Strategy review · '+esc(t.name)+'</div><p>'+profile+' This describes the current profile; it does not by itself establish a mistake.</p>'+(issues.length?'<p>'+issues.slice(0,2).join(' ')+'</p>':'<p>Investment choices have not yet been evaluated. The current differences come from your starting promise and naming fit.</p>')+'</div>'}
function valueFormula(scores){return '<div class="value-formula"><b>Brand Value = (D + R) × (E + K) × $5M</b>'+(scores?'<div>('+scores[0].toFixed(2)+' + '+scores[1].toFixed(2)+') × ('+scores[2].toFixed(2)+' + '+scores[3].toFixed(2)+') × $5M = <strong>'+money(bv(scores))+'</strong></div>':'')+'<small>D + R = Brand Strength · E + K = Brand Stature. All four pillars contribute; growth in either total increases value. High scores need not be equal. Displayed scores are rounded.</small></div>'}
function perceptionHTML(report){const rows=report.rows||[],mine=rows.find(r=>r.uid===store.uid());return '<div class="panel"><div class="eyebrow">Simulated customer-perception report</div><h3>What each brand is becoming known for</h3><small>These associations are inferred from the game’s investments and capability support—not measured survey responses.</small><div class="table-wrap"><table><tr><th>Brand / promise</th><th>Likely associations</th><th>Promise delivery</th></tr>'+rows.map(r=>{const t=dbState.teams[r.uid],associations=perceptionProfile(t,report.stage);let gaps=[];for(let stage=2;stage<=report.stage;stage++){const sub=t.submissions?.[stage];if(validSubmission(stage,sub))sub.plan.forEach((v,i)=>{if(v&&capabilitySupport(t,stage,ACTIONS[stage][i])<.85)gaps.push(ACTIONS[stage][i].name)})}return '<tr><td>'+esc(r.name)+'<br><small>'+PATH_NAMES[r.pos]+'</small></td><td>'+ (associations.join(' · ')||'Promise chosen; product evidence still to come.')+'</td><td>'+(gaps.length?'Credibility gaps: '+gaps.join(' · '):report.stage<4?'Product experience is not yet tested.':'No major capability gap detected in the selected investments.')+'</td></tr>'}).join('')+'</table></div>'+'</div>'}
function finalOverview(){const rows=game().reports?.[7]?.rows||[],leaders=rows.filter(r=>r.rank===1);if(!leaders.length)return '';return '<div class="panel"><div class="eyebrow">Best realized strategies in this session</div><h2>'+leaders.map(r=>esc(r.name)).join(' · ')+'</h2><p>'+money(bv(leaders[0].scores))+' final value. '+(leaders.length>1?'These teams tied for the lead.':'This was the highest-valued observed strategy.')+'</p>'+leaders.map(r=>'<details><summary>'+esc(r.name)+' · '+POSITIONS[r.pos]+'</summary>'+[2,3,4,5,6,7].map(stage=>'<p><b>'+STAGES[stage].name+':</b> '+(dbState.teams[r.uid]?.submissions?.[stage]?.plan||[]).map((v,i)=>v?ACTIONS[stage][i].name+' '+v:'').filter(Boolean).join(' · ')+'</p>').join('')+'</details>').join('')+'</div>'}
function alternativesHTML(uid){const comparisons=bestRoundAlternatives(game(),dbState.teams,uid);if(!comparisons.length)return '<p>No valid positioning was submitted, so no strategy comparison is available.</p>';return '<section class="panel alternatives"><div class="eyebrow">Personalized hindsight report</div><h2>Where your strategy could improve</h2>'+namingReview(uid)+'<p>For each round we tested all 1,158 legal portfolios; each alternative holds your previous product and brand decisions fixed. These are the best single-round alternatives given your actual earlier decisions and rivals’ actual commitments.</p><small>Each row is a separate comparison. Gains cannot be added together: changing earlier decisions also changes later capabilities. This is not a globally optimized full-game strategy.</small>'+comparisons.map(c=>'<details open><summary>'+STAGES[c.stage].name+' · '+(c.gap<.005?'Your choice matched the best round outcome':money(c.gap)+' more value was available that round')+'</summary><p><b>Your round-end value:</b> '+money(bv(c.actual.scores))+' · <b>Best round-end alternative:</b> '+money(bv(c.best.scores))+'</p>'+(c.gap<.005?'<p>Your portfolio was tied for the strongest outcome under these conditions.</p>':'<p><b>Where you deviated:</b></p><ul>'+c.changes.map(x=>'<li>'+x.name+': '+x.from+' → '+x.to+' credits</li>').join('')+'</ul><p><b>Stronger mix:</b> '+c.plan.map((v,i)=>v?ACTIONS[c.stage][i].name+' '+v:'').filter(Boolean).join(' · ')+'</p><p>'+c.actual.notes.filter(n=>!n.startsWith('Your mix')).map(esc).join(' ')+'</p>')+'</details>').join('')+'</section>'}
function guideHTML(){return '<h2>Six investment cycles</h2><p>Teams choose a name and promise, then invest in the same four areas each round. All eight methods appear together, grouped into four areas. All allocations save as they change; one funded method is a valid partial portfolio.</p>'+pillarGuide()+'<p>The naming key deducts up to 0.5 Knowledge for contradictory signals. All positioning profiles have a $210M base before this penalty. Product evidence supports trust; identity builds recognition and meaning; experience reinforces trust and understanding. Growth needs an established core. Market receptivity for growth rises from 60%, 70%, and 85% in the first three investment rounds to 100% in the final three. Each round can add at most 1.5 Strength and 1.5 Stature.</p><p>Budget: 25 credits each round, 5-credit steps, at most four methods, at most 15 per method. Returns depend on fit, earlier capabilities, rival overlap, and diminishing returns for concentration and repeated investment. A varied mix receives a small coordination benefit. Identity without product evidence earns less Esteem.</p><p>Maximum Strength remains 16 and Stature 15, so value cannot exceed $1.20B. Final comparisons exhaust all 1,158 valid single-round portfolios; their separate gaps cannot be added.</p><details><summary>Predefined naming-fit penalties</summary><div class="table-wrap"><table><tr><th>Name</th>'+POSITIONS.map(p=>'<th>'+p+'</th>').join('')+'</tr>'+NAME_BANK.map(n=>'<tr><td>'+n.name+'</td>'+n.penalty.map(v=>'<td>Knowledge −'+v+'</td>').join('')+'</tr>').join('')+'</table></div></details><p>Teacher password: glhf. This is a classroom entry gate; live database writes still require the configured Firebase instructor account.</p>'}
function render(){if(!store)return;const focus=document.activeElement?.id,selection=document.activeElement?.selectionStart,typed=document.activeElement?.value;if(view==='teacher'&&!store.teacher())view='login';$('app').innerHTML=header()+(view==='home'?homeHTML():view==='join'?joinHTML():view==='login'?loginHTML():view==='teacher'?teacherHTML():teamHTML())+'<footer>Brand Wars · Portfolio edition · '+(LIVE?'Live classroom':'Offline classroom')+'<span>BAV valuation: (D + R) × (E + K) × $5M</span></footer>';bind();updateClock();if(focus&&$(focus)){try{if(['team-number','teacher-pass','email','password'].includes(focus))$(focus).value=typed;$(focus).focus({preventScroll:true});if(typeof selection==='number')$(focus).setSelectionRange(selection,selection)}catch{}}}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(()=>handle(b.dataset.action)));document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>queueChoice({type:'pos',value:Number(b.dataset.pos)}));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const [index,delta]=b.dataset.adjust.split(':').map(Number);queueChoice({type:'allocation',index,delta})});document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{selectedArea=b.dataset.area;render()});if($('brand-name'))$('brand-name').onchange=()=>{if($('brand-name').value!=='')queueChoice({type:'name',value:Number($('brand-name').value)})};if($('mode'))$('mode').onchange=()=>act(()=>setClassMode($('mode').value));if($('teacher-pass'))$('teacher-pass').onkeydown=e=>{if(e.key==='Enter')act(()=>handle('login'))};}
function validateUI(){if($('save-status'))$('save-status').textContent=saving?'Saving…':game().stage===1&&openRound()&&!validSubmission(1,getDraft())?'Saved — choose both a name and a promise before time ends.':saveMessage}
function updateClock(){if($('connection'))$('connection').textContent=connection;if($('clock')){const sec=Math.ceil(remaining()/1000);$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')};if($('stage-status'))$('stage-status').textContent=(game().phase==='complete'?'Session complete':game().phase==='report'?'Report time · next stage opens automatically':game().phase==='final'?'Final debrief':game().phase==='open'?'Decision time · report opens automatically':'Briefing / ready')+(!game().running&&game().phase!=='complete'?' · paused / ready':'');if($('decision-fields'))$('decision-fields').disabled=!openRound();if($('waiting'))$('waiting').hidden=openRound();validateUI();autoTransition()}
function download(name,text,type='text/plain'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function handle(action){if(action==='home'){view='home';render()}
else if(action==='joinview'){view=myTeam()?'team':'join';render()}
else if(action==='teacherview'){view=store.teacher()?'teacher':'login';render()}
else if(action==='login'){await store.login($('teacher-pass')?.value,$('email')?.value,$('password')?.value);if(!dbState.game)await saveGame(freshGame());view='teacher';render()}
else if(action==='logout'){await store.logout();view='home';render()}
else if(action==='join'){await store.join(Number($('team-number').value));view='team';render()}
else if(action==='live'){const session=$('session').value.replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40)||'main';const u=new URL(location.href);u.searchParams.set('session',session);u.searchParams.set('live','1');location.href=u.href}
else if(['start','pause','report'].includes(action))await control(action);
else if(action==='reset'){if(confirm('Reset all scores and choices? Open student screens will reset too; team numbers stay joined.')){await resetSession();render()}}
else if(action==='guide'){$('dialog-body').innerHTML=guideHTML();$('dialog').showModal()}
else if(action==='export')download('brand-wars-'+SESSION+'-results.json',JSON.stringify(dbState,null,2),'application/json');
else if(action==='team-export'){const t=myTeam();let text='BRAND WARS — '+t.name+'\nSession: '+SESSION+'\n';for(const [stage,s] of Object.entries(t.submissions||{})){text+='\n'+STAGES[stage].name+'\n';if(s.plan)text+=s.plan.map((v,i)=>v?ACTIONS[stage][i].name+': '+v+' credits':'').filter(Boolean).join('\n')+'\n';const r=game().reports?.[stage]?.rows?.find(x=>x.uid===store.uid());if(r)text+='Value: '+money(bv(r.scores))+' · D/R/E/K: '+r.scores.map(v=>v.toFixed(2)).join('/')+'\n'+r.notes.join('\n')+'\n'}text+='\nBEST SINGLE-ROUND ALTERNATIVES\nEarlier decisions and rival commitments held fixed; do not add these gaps together.\n';for(const c of bestRoundAlternatives(game(),dbState.teams,store.uid())){text+='\n'+STAGES[c.stage].name+': actual '+money(bv(c.actual.scores))+'; best '+money(bv(c.best.scores))+'; gap '+money(c.gap)+'\n'+c.changes.map(x=>x.name+': '+x.from+' -> '+x.to+' credits').join('\n')+'\n'}download('brand-wars-team-recap.txt',text)}
}
$('dialog-close').onclick=()=>$('dialog').close();$('error-close').onclick=()=>$('error').hidden=true;
(async()=>{try{store=LIVE?await firebaseStore():offlineStore();store.start(onData);render();setInterval(updateClock,250)}catch(e){showError('Could not connect. '+e.message+' Open the file without ?live=1 for an offline teacher demo.');$('app').innerHTML='<h1>Connection needs setup.</h1><p>Follow SETUP.md to enable live classroom mode.</p><a href="'+esc(location.pathname)+'">Open offline version</a>'}})();

function benefitGapsHTML(report){return ''}
function pillarGuide(){return '<details class="panel"><summary>What the four pillars mean</summary><p><b>Differentiation:</b> a meaningful reason this brand feels distinct.</p><p><b>Relevance:</b> how well the brand fits customers’ needs and lives.</p><p><b>Esteem:</b> respect, perceived quality and trust—do people think the brand is good?</p><p><b>Knowledge:</b> familiarity and understanding—do people recognize the brand and know what it stands for?</p><p>A famous or familiar brand can have weak Esteem. A respected specialist brand can have low Knowledge. Product guidance and clear identity build understanding; dependable performance builds trust.</p></details>'}
function esteemKnowledgeHTML(report){const rows=report.rows||[];if(!rows.length)return '';return '<div class="panel"><h3>Known and understood vs respected and trusted</h3><p><b>Knowledge</b> is familiarity and understanding. <b>Esteem</b> is respect for quality and credibility. They need not grow together.</p><div class="map"><svg viewBox="0 0 600 290" role="img" aria-label="Knowledge versus Esteem comparison"><rect x="55" y="15" width="520" height="225" fill="#101c24"/>'+[5,10,15].map(v=>'<line x1="55" y1="'+(240-v*13)+'" x2="575" y2="'+(240-v*13)+'" stroke="#34484f"/><text x="25" y="'+(244-v*13)+'" fill="#a5b8bd" font-size="11">'+v+'</text><text x="'+(50+v*30)+'" y="257" fill="#a5b8bd" font-size="11">'+v+'</text>').join('')+rows.map(r=>'<circle cx="'+(55+r.scores[3]*30)+'" cy="'+(240-r.scores[2]*13)+'" r="'+(r.uid===store.uid()?8:5)+'" fill="'+['#d7f879','#7bd5ef','#e9a6ff'][r.pos]+'"><title>'+esc(r.name)+' · Knowledge '+r.scores[3].toFixed(2)+' · Esteem '+r.scores[2].toFixed(2)+'</title></circle>').join('')+'<text x="210" y="281" fill="#b6c7c8" font-size="12">Knowledge: recognition & understanding →</text><text x="12" y="195" transform="rotate(-90 12 195)" fill="#b6c7c8" font-size="12">Esteem: respect & trust →</text></svg></div><div class="table-wrap"><table><tr><th>Team / brand</th><th>Knowledge</th><th>Esteem</th><th>Interpretation</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.scores[3].toFixed(2)+'</td><td>'+r.scores[2].toFixed(2)+'</td><td>'+(r.scores[3]>r.scores[2]+1?'Better known than regarded':r.scores[2]>r.scores[3]+1?'More respected than understood':'Fairly balanced profile')+'</td></tr>').join('')+'</table></div></div>'}

function namingReview(uid){const sub=dbState.teams[uid]?.submissions?.[1];if(!validSubmission(1,sub))return '';const name=NAME_BANK[sub.nameId],penalty=name.penalty[sub.pos];return '<div class="note"><b>Name and promise: '+name.name+' / '+POSITIONS[sub.pos]+'</b><p>'+(penalty?'The predefined associations conflicted with your promise, costing '+penalty+' Knowledge at the start. Better-aligned name options include '+nameIdsFor(uid).map(i=>NAME_BANK[i]).filter(n=>n.penalty[sub.pos]===0).map(n=>n.name).join(', ')+'.':'Your name was consistent with the chosen promise; there was no naming penalty.')+'</p></div>'}

</script></body></html>
